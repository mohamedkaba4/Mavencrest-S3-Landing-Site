<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Wizard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      color: #333;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .weather-app {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 300px;
    }

    h1 { margin-bottom: 20px; font-size: 2rem; color: #333; }
    input {
      width: 80%; padding: 10px; margin-bottom: 20px;
      border-radius: 10px; border: 1px solid #ccc; text-align: center;
      font-size: 1rem;
    }
    button {
      padding: 10px 20px; border: none; border-radius: 10px;
      background: linear-gradient(to right, #6a11cb, #2575fc); color: white;
      font-size: 1rem; cursor: pointer; transition: 0.3s;
    }
    button:hover { transform: scale(1.05); }
    .weather-info { margin-top: 20px; font-size: 1.1rem; }
    .temp { font-size: 2rem; font-weight: bold; }
    .icon { font-size: 3rem; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="weather-app">
    <h1>Weather Wizard</h1>
    <input type="text" id="city" placeholder="Enter city name">
    <br>
    <button onclick="getWeather()">Check Weather</button>
    <div class="weather-info" id="weather-info"></div>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById('city').value.trim();
      const infoDiv = document.getElementById('weather-info');
      const apiKey = 'ee31a1ea8cd8f5e4f97eb5fcc9a65af2'; // Replace with your OpenWeatherMap API key

      if (!city) {
        infoDiv.innerHTML = "<p>Please enter a city!</p>";
        return;
      }

      try {
        const response = await fetch(
          `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`
        );

        if (!response.ok) {
          throw new Error("City not found bro");
        }

        const data = await response.json();

        // Map weather conditions to emojis
        const weatherMap = {
          "Clear": "☀️",
          "Clouds": "⛅",
          "Rain": "🌧️",
          "Drizzle": "🌦️",
          "Thunderstorm": "⛈️",
          "Snow": "❄️",
          "Mist": "🌫️"
        };

        const emoji = weatherMap[data.weather[0].main] || "🌈";

        infoDiv.innerHTML = `
          <div class="icon">${emoji}</div>
          <div class="temp">${Math.round(data.main.temp)}°C</div>
          <p>${data.weather[0].description}</p>
          <p>${data.name}, ${data.sys.country}</p>
        `;
      } catch (error) {
        infoDiv.innerHTML = `<p>Error: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
